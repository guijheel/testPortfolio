<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Futuriste - Développeur Full-Stack</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background animé -->
    <div class="animated-background">
        <!-- Codes hexadécimaux -->
        <div class="hex-container" id="hexContainer"></div>
        
        <!-- Codes React -->
        <div class="react-container" id="reactContainer"></div>
        
        <!-- Codes assembleur -->
        <div class="asm-container" id="asmContainer"></div>
        
        <!-- Étoiles -->
        <div class="stars-container" id="starsContainer"></div>
    </div>

    <!-- Effets de lumière ambiante -->
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <!-- Contenu principal -->
    <main class="main-content">
        <div class="container">
            <div class="glass-card">
                <h1 class="hero-title">Développeur Full-Stack</h1>
                <h2 class="hero-subtitle">& Designer UI/UX</h2>
                <p class="hero-description">
                    Création d'expériences numériques avec des technologies de pointe et des solutions de design innovantes. 
                    Spécialisé en React, Node.js, et développement mobile.
                </p>
            </div>
        </div>
    </main>

    <script src="scripts/animations.js"></script>
</body>
</html>
